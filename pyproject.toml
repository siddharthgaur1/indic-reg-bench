[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indic-reg-bench"
version = "0.1.0"
description = "An open benchmark for Indian regulatory document understanding, built on SEBI enforcement orders"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["requests>=2.31", "pdfplumber>=0.11", "beautifulsoup4>=4.12"]

[project.scripts]
indic-reg-bench = "indic_reg_bench.cli:main"

[project.urls]
Homepage = "https://github.com/siddharthgaur1/indic-reg-bench"

[tool.setuptools.packages.find]
where = ["src"]
