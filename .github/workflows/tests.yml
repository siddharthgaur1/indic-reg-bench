name: tests

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e . pytest
      # No network: the scrapers are exercised against captured markup, and the
      # corpus is absent in CI by design (order text is not redistributed).
      - run: python -m pytest tests/ -q
      - run: python scripts/test_fetch_orders.py
      - run: indic-reg-bench tasks
